    { name = "Biswajit", email = "biswajeet82498@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-sarvam>=0.1.2",
    "pandas>=3.0.5",
    "protobuf>=7.35.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sarvam>=0.0.0",
    "sarvamai>=0.1.30",
    "scikit-learn>=1.9.0",
